<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Assign Licenses — ACME</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#092f42;
    --teal:#0276b1;
    --teal-dark:#02618f;
    --border:#dfe4e6;
    --border-light:#ebeef0;
    --bg-page:#f5f6f7;
    --bg-white:#ffffff;
    --bg-blue-light:#e3f4fd;
    --blue-100:#b7e4fb;
    --text-secondary:#5d7682;
    --text-disabled:#b3bec4;
    --text-error:#ca2b34;
    --bg-error:#fef5f5;
    --red-200:#f3a5aa;
    --green-200:#4ac97f;
    --radius-card:8px;
    --radius-int:6px;
    --shadow-card:2px 2px 8px rgba(9,30,66,0.10);
    --shadow-header:0 2px 4px rgba(9,30,66,0.10);
    --shadow-btn:0 1px 2px rgba(9,30,66,0.10);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Fira Sans',sans-serif;
    background:var(--bg-page);
    color:var(--navy);
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit;}
  input,select{font-family:inherit;}
  a{text-decoration:none;cursor:pointer;}

  .app{min-height:100vh;display:flex;flex-direction:column;}

  /* ===== Top nav ===== */
  .topnav{
    background:var(--bg-white);
    box-shadow:var(--shadow-header);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 24px;height:60px;flex:0 0 60px;
    position:relative;z-index:5;
  }
  .topnav-left{display:flex;align-items:center;gap:28px;}
  .logo{font-size:20px;font-weight:700;color:var(--teal);letter-spacing:-0.3px;}
  .navlink{font-size:14px;font-weight:500;color:var(--navy);display:flex;align-items:center;gap:4px;}
  .topnav-right{display:flex;align-items:center;gap:12px;}
  .org-switch{
    border:1px solid var(--border);border-radius:var(--radius-int);
    padding:7px 12px;font-size:14px;font-weight:500;color:var(--navy);
    display:flex;align-items:center;gap:8px;background:var(--bg-white);
  }
  .avatar{
    width:32px;height:32px;border-radius:50%;background:var(--bg-blue-light);
    color:var(--teal);font-size:13px;font-weight:700;display:flex;align-items:center;
    justify-content:center;border:1px solid var(--blue-100);
  }

  /* ===== Page shell ===== */
  .page{
    flex:1;max-width:1312px;width:100%;margin:0 auto;padding:32px 24px 100px;
  }
  .breadcrumb{font-size:13px;color:var(--teal);font-weight:500;display:inline-flex;align-items:center;gap:4px;margin-bottom:8px;}
  .breadcrumb:hover{text-decoration:underline;}
  .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;flex-wrap:wrap;margin-bottom:38px;}
  h1{font-size:26px;font-weight:600;margin:0 0 4px;color:var(--navy);}
  .subtitle{font-size:14px;color:var(--text-secondary);margin:0;}

  /* ===== Progress tracker ===== */
  .tracker{display:flex;gap:8px;flex-wrap:wrap;}
  .pill{
    display:flex;align-items:center;gap:6px;height:40px;padding:0 16px;border-radius:6px;
    font-size:14px;font-weight:600;border:1px solid var(--border);background:var(--bg-white);
    color:var(--navy);white-space:nowrap;transition:background .15s,border-color .15s,color .15s;
  }
  .pill.collapsed{padding:0 13px;}
  .pill.active{background:var(--teal);color:#fff;border-color:var(--teal);}
  .pill.completed{border-color:var(--teal);color:var(--teal);cursor:pointer;}
  .pill.completed:hover{background:var(--bg-blue-light);}
  .pill.disabled{color:var(--text-disabled);cursor:default;}
  .pill svg{flex:0 0 auto;}

  /* ===== Cards / generic ===== */
  .card{
    background:var(--bg-white);border-radius:var(--radius-card);box-shadow:var(--shadow-card);
  }
  .row-between{display:flex;align-items:center;justify-content:space-between;gap:12px;}
  .muted{color:var(--text-secondary);font-size:13px;}
  .link{color:var(--teal);font-size:14px;font-weight:600;background:none;border:none;padding:0;}
  .link-sm{color:var(--teal);font-size:12px;font-weight:600;background:none;border:none;padding:0;cursor:pointer;}
  .link-sm:hover{text-decoration:underline;}
  .link:hover{text-decoration:underline;}
  .link:disabled{color:var(--text-disabled);cursor:default;text-decoration:none;}
  h3{font-size:14px;font-weight:600;margin:0;color:var(--navy);}
  h4{font-size:14px;font-weight:600;margin:0;color:var(--navy);}
  label{font-size:13px;font-weight:500;color:var(--navy);display:block;margin-bottom:6px;}
  .req{color:var(--text-error);}

  input[type=text],input[type=email],input[type=date],select{
    width:100%;height:40px;border:1px solid var(--border);border-radius:var(--radius-int);
    padding:0 12px;font-size:14px;color:var(--navy);background:var(--bg-white);outline:none;
  }
  input::placeholder{color:var(--text-disabled);}
  input:focus,select:focus{border-color:var(--teal);box-shadow:0 0 0 3px rgba(2,118,177,0.12);}
  input.invalid{border-color:var(--text-error);}
  select{appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8"><path d="M1 1l5 5 5-5" stroke="%235d7682" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>');background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;}

  .field-error{font-size:12px;color:var(--text-error);margin-top:-2px;margin-bottom:10px;min-height:0;display:none;}
  .field-error.show{display:block;}
  .field-gap{margin-bottom:14px;}

  /* ===== Buttons ===== */
  .btn{
    height:36px;padding:0 16px;border-radius:var(--radius-int);font-size:14px;font-weight:600;
    border:1px solid transparent;display:inline-flex;align-items:center;gap:6px;cursor:pointer;
    box-shadow:var(--shadow-btn);transition:background .15s,opacity .15s;
  }
  .btn-primary{background:var(--teal);color:#fff;}
  .btn-primary:hover{background:var(--teal-dark);}
  .btn-primary:disabled{background:var(--border);color:var(--text-disabled);cursor:not-allowed;box-shadow:none;}
  .btn-secondary{background:#fff;color:var(--navy);border-color:var(--border);}
  .btn-secondary:hover{background:var(--bg-page);}
  .btn-ghost{background:transparent;color:var(--navy);border-color:var(--border);}
  .btn-sm{height:32px;padding:0 14px;font-size:13px;}

  /* ===== Chips ===== */
  .chip-row{display:flex;flex-wrap:wrap;gap:8px;}
  .chip{
    height:32px;border-radius:16px;border:1px solid var(--teal);color:var(--teal);
    font-size:13px;font-weight:500;padding:0 12px;display:inline-flex;align-items:center;gap:8px;
    background:#fff;cursor:default;
  }
  .chip.removable{padding-right:8px;}
  .chip .x{cursor:pointer;font-size:15px;line-height:1;color:var(--teal);opacity:.7;}
  .chip .x:hover{opacity:1;}
  .chip-filter{cursor:pointer;user-select:none;}
  .chip-filter.selected{background:var(--teal);color:#fff;}
  .chip-toggle{cursor:pointer;user-select:none;}
  .chip-toggle.selected{background:var(--teal);color:#fff;}
  .chip-toggle.disabled{border-color:var(--border);color:var(--text-disabled);cursor:not-allowed;background:var(--bg-page);}
  .chip-add{border-style:solid;color:var(--teal);cursor:pointer;background:#fff;}
  .chip-add:hover{background:var(--bg-blue-light);}
  .skipped-row{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--red-200);
    border-radius:var(--radius-int);font-size:13px;cursor:pointer;transition:background .12s,border-color .12s;
  }
  .skipped-row:hover{border-color:var(--text-error);}
  .skipped-row .check{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--red-200);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .skipped-row .email{flex:1;color:var(--navy);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .skipped-row .x{color:var(--text-error);opacity:.7;flex:0 0 auto;display:flex;}
  .skipped-row .x:hover{opacity:1;}
  .skipped-row.selected{background:var(--bg-blue-light);border-color:var(--teal);}
  .skipped-row.selected .check{background:var(--teal);border-color:var(--teal);}
  .chip.static{cursor:default;}

  /* ===== Step 1 ===== */
  .tabs{display:flex;justify-content:center;gap:32px;border-bottom:1px solid var(--border);margin-bottom:32px;}
  .tab{
    background:none;border:none;padding:0 0 12px;font-size:14px;font-weight:600;color:var(--text-secondary);
    border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;
  }
  .tab.active{color:var(--teal);border-bottom-color:var(--teal);}

  .step1-panels{display:flex;justify-content:center;}
  .step1-cards{display:flex;gap:16px;align-items:flex-start;}
  .form-card{width:418px;padding:24px;}
  .form-card h3{margin-bottom:20px;}
  .list-card{width:296px;padding:24px;min-height:60px;}
  .list-head{display:flex;align-items:center;gap:8px;margin-bottom:14px;}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--green-200);flex:0 0 auto;}
  .dot.zero{background:var(--text-disabled);}
  .empty-hint{font-size:13px;color:var(--text-disabled);}

  .list-card .chip-row{max-height:320px;overflow-y:auto;padding-right:6px;margin-right:-6px;
    scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .list-card .chip-row::-webkit-scrollbar{width:6px;}
  .list-card .chip-row::-webkit-scrollbar-track{background:transparent;}
  .list-card .chip-row::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .list-card .chip-row::-webkit-scrollbar-thumb:hover{background:var(--text-disabled);}

  .bulk-placeholder{width:634px;padding:48px 40px;text-align:center;}
  .bulk-placeholder svg{margin-bottom:16px;}
  .bulk-placeholder h3{font-size:16px;margin-bottom:8px;}
  .bulk-placeholder p{font-size:14px;color:var(--text-secondary);margin:0 0 20px;max-width:380px;margin-left:auto;margin-right:auto;}

  /* ===== Step 2 ===== */
  .step2-wrap{display:flex;justify-content:center;gap:16px;align-items:flex-start;}
  .program-card{width:418px;padding:24px;flex:0 0 auto;}
  .filter-group{margin-top:18px;}
  .filter-label{display:block;font-size:11px;font-weight:600;letter-spacing:.04em;color:var(--text-secondary);text-transform:uppercase;margin-bottom:8px;}

  .roster-card{width:320px;padding:24px;flex:0 0 auto;}
  .seat-counter{font-size:12px;color:var(--text-secondary);margin:6px 0 12px;}
  .seat-counter.error{color:var(--text-error);}
  .roster-empty{font-size:13px;color:var(--text-disabled);padding:4px 0 8px;}
  .roster-list{display:flex;flex-direction:column;gap:6px;max-height:340px;overflow-y:auto;padding-right:6px;margin-right:-6px;
    scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .roster-list::-webkit-scrollbar{width:6px;}
  .roster-list::-webkit-scrollbar-track{background:transparent;}
  .roster-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .roster-list::-webkit-scrollbar-thumb:hover{background:var(--text-disabled);}
  .roster-row{
    display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--border-light);
    border-radius:var(--radius-int);font-size:13px;transition:background .12s,border-color .12s;
  }
  .roster-row .check{
    width:16px;height:16px;border-radius:4px;border:1.5px solid var(--border);flex:0 0 auto;
    display:flex;align-items:center;justify-content:center;
  }
  .roster-row .email{flex:1;color:var(--navy);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .roster-row .badge{font-size:11px;color:var(--text-secondary);background:var(--bg-page);padding:2px 8px;border-radius:10px;white-space:nowrap;flex:0 0 auto;}
  .roster-row .roster-remove{flex:0 0 auto;display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:4px;cursor:pointer;opacity:.5;}
  .roster-row .roster-remove:hover{opacity:1;background:var(--bg-page);}
  .roster-row.selectable{cursor:pointer;}
  .roster-row.selectable:hover{border-color:var(--teal);}
  .roster-row.selected{background:var(--bg-blue-light);border-color:var(--teal);}
  .roster-row.selected .check{background:var(--teal);border-color:var(--teal);}
  .roster-row.disabled{opacity:.55;}
  .roster-row.disabled .email{color:var(--text-secondary);}

  .info-box{border-radius:var(--radius-int);padding:12px 16px;margin-top:18px;background:var(--bg-blue-light);}
  .info-box strong{display:block;font-size:14px;color:var(--navy);margin-bottom:2px;}
  .info-box span{font-size:13px;color:var(--text-secondary);}
  .info-box.error{background:var(--bg-error);}
  .info-box.error strong{color:var(--text-error);}
  .info-box.error p{font-size:13px;color:var(--text-secondary);margin:4px 0 0;}

  .date-row{
    display:flex;align-items:center;justify-content:space-between;margin-top:12px;
    background:var(--bg-page);border-radius:var(--radius-int);padding:10px 16px;font-size:14px;
  }
  .date-row input[type=date]{height:32px;width:170px;}

  .select-learners{margin-top:24px;}
  .seat-count{font-size:12px;color:var(--text-secondary);margin:6px 0 12px;}
  .cap-note{font-size:12px;color:var(--text-error);margin-top:8px;display:none;}
  .cap-note.show{display:block;}

  .recap-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border-light);font-size:13px;}
  .recap-row:last-child{border-bottom:none;}
  .recap-row .name{font-weight:600;color:var(--navy);}
  .recap-row .count{color:var(--text-secondary);}
  .recap-warning{font-size:12px;color:var(--text-error);margin-top:10px;}

  /* ===== Step 3 ===== */
  .step3-wrap{display:flex;justify-content:center;}
  .review-card{width:418px;padding:24px;}
  .program-summary{background:var(--bg-blue-light);border-radius:var(--radius-int);padding:16px;margin-top:16px;transition:outline-color .12s;outline:2px dashed transparent;outline-offset:2px;}
  .program-summary.drop-hover{outline-color:var(--teal);background:#d9edfb;}
  .chip[draggable="true"]{cursor:grab;}
  .chip[draggable="true"]:active{cursor:grabbing;}
  .chip.dragging{opacity:.4;}
  .skipped-row[draggable="true"]{cursor:grab;}
  .skipped-row.dragging{opacity:.4;}
  .roster-list.drop-hover{outline:2px dashed var(--text-error);outline-offset:2px;border-radius:var(--radius-int);}
  .program-summary .title-line{font-size:14px;font-weight:600;color:var(--navy);}
  .program-summary .seats-line{font-size:13px;color:var(--text-secondary);}
  .program-summary .date-line{font-size:13px;color:var(--text-secondary);margin:2px 0 12px;}
  .skipped-section{margin-top:24px;}
  .skipped-section p{font-size:13px;color:var(--text-secondary);margin:6px 0 12px;}
  .skipped-assign-actions{display:flex;flex-wrap:wrap;gap:8px;}
  .skipped-assign-actions .muted{font-size:12px;}
  .all-assigned{font-size:13px;color:var(--text-secondary);margin-top:24px;display:flex;align-items:center;gap:8px;}

  /* ===== Footer bar ===== */
  .widget-footer{
    background:var(--bg-white);border-top:1px solid var(--border);
    padding:16px 24px;display:flex;align-items:center;justify-content:space-between;
    position:fixed;bottom:0;left:0;right:0;z-index:20;
    box-shadow:0 -2px 8px rgba(9,30,66,0.08);
  }
  .footer-right{display:flex;gap:10px;}

  /* ===== Success screen ===== */
  .success-wrap{display:flex;justify-content:center;padding:60px 0;}
  .success-card{width:480px;text-align:center;padding:48px 32px;}
  .success-card h2{font-size:20px;margin:16px 0 8px;}
  .success-card p{font-size:14px;color:var(--text-secondary);margin:0 0 28px;}
  .success-actions{display:flex;justify-content:center;gap:10px;}

  /* ===== Modal ===== */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(9,30,66,0.45);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:24px;
  }
  .modal{background:#fff;border-radius:var(--radius-card);width:560px;max-height:80vh;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(9,30,66,0.25);}
  .modal-head{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
  .modal-head h3{font-size:16px;}
  .modal-close{background:none;border:none;cursor:pointer;color:var(--text-secondary);font-size:18px;line-height:1;padding:4px;}
  .modal-body{padding:20px 24px;overflow-y:auto;}
  .modal-foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px;}

  .catalog-group{margin-bottom:18px;}
  .catalog-group-title{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--text-secondary);margin-bottom:8px;}
  .catalog-service-title{font-size:15px;font-weight:600;color:var(--navy);margin:18px 0 10px;}
  .catalog-service-title:first-child{margin-top:0;}
  .funded-badge{font-size:10px;font-weight:700;letter-spacing:.02em;color:var(--teal);background:var(--bg-blue-light);padding:2px 7px;border-radius:10px;margin-left:6px;vertical-align:middle;}
  .catalog-search{width:100%;height:40px;border:1px solid var(--border);border-radius:var(--radius-int);padding:0 12px;font-size:14px;outline:none;margin-bottom:18px;}
  .catalog-search:focus{border-color:var(--teal);}
  .catalog-filters-row{display:flex;gap:28px;margin-bottom:16px;flex-wrap:wrap;}
  .catalog-row{
    display:flex;align-items:center;justify-content:space-between;padding:10px 12px;border:1px solid var(--border-light);
    border-radius:var(--radius-int);margin-bottom:8px;
  }
  .catalog-row .name{font-size:14px;font-weight:500;color:var(--navy);}
  .catalog-row .meta{font-size:12px;color:var(--text-secondary);}
  .catalog-row .meta.zero{color:var(--text-error);}
  .catalog-row .pick{font-size:13px;font-weight:600;color:var(--teal);background:none;border:1px solid var(--teal);border-radius:6px;padding:5px 12px;cursor:pointer;}
  .catalog-row .pick:hover{background:var(--bg-blue-light);}
  .catalog-row .pick:disabled{border-color:var(--border);color:var(--text-disabled);cursor:not-allowed;}

  /* Toast */
  #toastRoot{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;}
  .toast{
    background:var(--navy);color:#fff;font-size:13px;font-weight:500;padding:10px 18px;border-radius:8px;
    box-shadow:0 8px 20px rgba(9,30,66,0.3);opacity:0;transform:translateY(8px);transition:opacity .2s,transform .2s;
  }
  .toast.show{opacity:1;transform:translateY(0);}

  .icon-inline{display:inline-flex;vertical-align:middle;}

  /* ===== Single-page layout (no wizard) ===== */
  .toolbar-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;}
  .toolbar-row .subtitle{margin:0;}

  .bulk-bar{
    display:flex;align-items:center;justify-content:space-between;background:var(--bg-blue-light);
    border:1px solid var(--blue-100);border-radius:var(--radius-int);padding:10px 16px;margin-bottom:16px;
    font-size:13px;color:var(--navy);
  }
  .bulk-bar strong{font-weight:600;}
  .bulk-bar-actions{display:flex;align-items:center;gap:16px;}

  .builder-wrap{display:flex;justify-content:center;gap:16px;align-items:flex-start;}
  .learners-col{width:360px;flex:0 0 auto;position:sticky;top:24px;}
  .groups-col{width:460px;display:flex;flex-direction:column;gap:14px;flex:0 0 auto;}

  .group-card{
    background:var(--bg-white);border-radius:var(--radius-card);box-shadow:var(--shadow-card);padding:20px 22px;
    border:2px dashed transparent;outline:none;transition:border-color .12s,background .12s;
  }
  .group-card.drop-hover{border-color:var(--teal);background:var(--bg-blue-light);}
  .group-card .filter-group{margin-top:14px;}
  .group-card .filter-group:first-of-type{margin-top:0;}
  .group-avail-line{font-size:12px;color:var(--text-secondary);margin-top:10px;background:var(--bg-page);padding:7px 10px;border-radius:6px;}
  .group-avail-line.error{color:var(--text-error);background:var(--bg-error);}
  .group-chip-row{margin-top:12px;}
  .group-card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .group-drop-hint{font-size:12px;color:var(--text-disabled);}
  .group-card-actions{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;}
  .group-card.collapsed{padding-bottom:16px;}
  .empty-hint-card{
    background:var(--bg-blue-light);border:1px dashed var(--blue-100);border-radius:var(--radius-card);
    padding:16px 18px;font-size:13px;color:var(--navy);margin-bottom:14px;line-height:1.5;
  }
  .new-group-btn{
    border:1.5px dashed var(--border);border-radius:var(--radius-card);background:transparent;color:var(--teal);
    font-size:14px;font-weight:600;padding:16px;cursor:pointer;text-align:center;
  }
  .new-group-btn:hover{background:var(--bg-blue-light);border-color:var(--blue-100);}

  .learners-card{padding:20px 22px;}
  .learners-card-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;}
  .learner-count-line{font-size:12px;color:var(--text-secondary);margin-bottom:12px;}

  .learner-row{
    display:flex;align-items:flex-start;gap:10px;padding:10px;border:1px solid var(--border-light);border-radius:var(--radius-int);
    margin-bottom:8px;cursor:grab;transition:background .12s,border-color .12s;
  }
  .learner-row:active{cursor:grabbing;}
  .learner-row.dragging{opacity:.4;}
  .learner-row input[type=checkbox]{margin-top:2px;flex:0 0 auto;}
  .learner-row-body{flex:1;min-width:0;}
  .learner-row .l-email{font-size:13px;font-weight:500;color:var(--navy);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .learner-row .l-badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px;}
  .learner-row .l-unassigned{font-size:11px;color:var(--text-disabled);margin-top:4px;}
  .learner-remove{flex:0 0 auto;cursor:pointer;opacity:.5;padding:2px;}
  .learner-remove:hover{opacity:1;}

  .assign-badge{
    display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;color:var(--teal);
    background:var(--bg-blue-light);border:1px solid var(--blue-100);padding:2px 6px 2px 8px;border-radius:10px;
  }
  .assign-badge .x{cursor:pointer;opacity:.6;display:flex;}
  .assign-badge .x:hover{opacity:1;}

  .learners-list-wrap{max-height:calc(100vh - 300px);overflow-y:auto;padding-right:6px;margin-right:-6px;
    scrollbar-width:thin;scrollbar-color:var(--border) transparent;}
  .learners-list-wrap::-webkit-scrollbar{width:6px;}
  .learners-list-wrap::-webkit-scrollbar-track{background:transparent;}
  .learners-list-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px;}
  .learners-list-wrap.drop-hover{outline:2px dashed var(--text-error);outline-offset:2px;border-radius:var(--radius-int);}

  .stats-text{font-size:13px;color:var(--text-secondary);}
  .stats-text strong{color:var(--navy);font-weight:600;}

  /* Add Learners modal */
  .add-modal-tabs{display:flex;gap:24px;border-bottom:1px solid var(--border);margin-bottom:20px;}
  .add-modal-tabs .tab{background:none;border:none;padding:0 0 10px;font-size:14px;font-weight:600;color:var(--text-secondary);border-bottom:2px solid transparent;cursor:pointer;margin-bottom:-1px;}
  .add-modal-tabs .tab.active{color:var(--teal);border-bottom-color:var(--teal);}
  .add-modal-ready{margin-top:18px;padding-top:16px;border-top:1px solid var(--border-light);}
</style>
</head>
<body>

<div class="app">
  <div class="topnav">
    <div class="topnav-left">
      <span class="logo">ACME</span>
      <span class="navlink">Analytics ▾</span>
      <span class="navlink" style="color:var(--teal);font-weight:600;">Learners</span>
    </div>
    <div class="topnav-right">
      <div class="org-switch">ACME Corporation
        <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="#5d7682" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="avatar">AL</div>
    </div>
  </div>

  <div class="page">
    <a class="breadcrumb">‹ Back to Learners</a>
    <div class="toolbar-row">
      <div>
        <h1>Assign Licenses</h1>
        <p class="subtitle">Add learners and set up programs in any order, then drag learners onto a program — or a few — to assign them.</p>
      </div>
    </div>

    <div class="builder-wrap">
      <div class="learners-col" id="learnersCol"></div>
      <div class="groups-col" id="groupsCol"></div>
    </div>
  </div>

  <div class="widget-footer" id="footerRoot"></div>
</div>

<div id="modalRoot"></div>
<div id="toastRoot"></div>

<script>
/* =====================================================
   DATA
===================================================== */
const CATALOG = {
  Digital: {
    Languages: [
      { id:'digital-languages-en', subject:'English', hours:null, seats:1000, start:'2026-08-01', end:'2028-07-31', funded:true },
      { id:'digital-languages-de', subject:'German',  hours:null, seats:5,    start:'2026-07-30', end:'2027-07-30' },
      { id:'digital-languages-it', subject:'Italian', hours:null, seats:5,    start:'2026-08-10', end:'2027-08-10' },
      { id:'digital-languages-es', subject:'Spanish', hours:null, seats:5,    start:'2026-08-01', end:'2027-08-01' },
    ],
  },
  Coach: {
    Languages: [
      { id:'coach-languages-en24', subject:'English', hours:24, seats:10, start:'2026-07-28', end:'2027-07-28' },
      { id:'coach-languages-en40', subject:'English', hours:40, seats:10, start:'2026-07-28', end:'2027-07-28' },
      { id:'coach-languages-fr24', subject:'French',  hours:24, seats:20, start:'2026-07-28', end:'2027-08-28' },
    ],
    Interpersonal: [
      { id:'coach-interpersonal-peak', subject:'Coaching for Peak Performance', hours:6, seats:5, start:'2026-08-15', end:'2026-12-31' },
    ],
  },
};
const ENTRY_INDEX = {};
Object.keys(CATALOG).forEach(service=>{
  Object.keys(CATALOG[service]).forEach(portfolio=>{
    CATALOG[service][portfolio].forEach(entry=>{ ENTRY_INDEX[entry.id] = { ...entry, service, portfolio }; });
  });
});
function getEntry(entryId){ return ENTRY_INDEX[entryId]; }
function entryLabel(entry){ return entry.hours ? `${entry.subject} · ${entry.hours}h` : entry.subject; }
function getEntriesFor(service, portfolio, subjectName){ return CATALOG[service][portfolio].filter(e=>e.subject===subjectName); }
function distinctSubjects(service, portfolio){
  const seen = new Set(); const out = [];
  CATALOG[service][portfolio].forEach(e=>{ if(!seen.has(e.subject)){ seen.add(e.subject); out.push(e.subject); } });
  return out;
}
const GROUPS = ['No Group Assigned','Marketing Team','Sales Team','Customer Success','Engineering'];

/* =====================================================
   STATE
   A learner can now belong to MULTIPLE program groups at once —
   membership is additive, not exclusive. There is no wizard;
   everything below renders on one page.
===================================================== */
let learners = [];      // {id, email, firstName, lastName, group}
let nextId = 1;
let groups = [];        // {id, service, portfolio, entryId, subject, hours, funded, seats, start, end, startDate, assignedIds:Set}
let nextGroupId = 1;
let selectedIds = new Set();   // checked rows in the Learners panel, for bulk actions
let addModalOpen = false;
let addModalTab = 'individual';
let pendingCardPickerGroupId = null; // set when "+ Add Learners" on a card redirects to the Add Learners modal (no learners exist yet)
let bulkAssignState = null;    // cascade state for the "Assign Selected to a Program" modal

/* =====================================================
   HELPERS
===================================================== */
function fmtDate(iso){ const d = new Date(iso+'T00:00:00'); return d.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function todayISO(){ return '2026-08-11'; }
function emailValid(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function showToast(msg){
  const root = document.getElementById('toastRoot');
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  root.appendChild(el);
  requestAnimationFrame(()=>el.classList.add('show'));
  setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.remove(),200); }, 2800);
}
function iconCheck(color){ return `<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><path d="M2 6.2l2.8 2.8L10 3" stroke="${color}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`; }
function iconX(color){ return `<svg width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M1 1l8 8M9 1l-8 8" stroke="${color}" stroke-width="1.4" stroke-linecap="round"/></svg>`; }

/* ---- Seat accounting ---- */
function remainingSeatsToAdd(entryId){
  let used = 0;
  groups.forEach(g=>{ if(g.entryId===entryId) used += g.assignedIds.size; });
  return getEntry(entryId).seats - used;
}
function programsOf(learnerId){ return groups.filter(g=>g.assignedIds.has(learnerId)); }
function isAssigned(learnerId){ return groups.some(g=>g.assignedIds.has(learnerId)); }
function assignedLearnersCount(){ return learners.filter(l=>isAssigned(l.id)).length; }
function activeGroups(){ return groups.filter(g=>g.entryId); }

/* =====================================================
   MASTER RENDER
===================================================== */
function renderAll(){
  renderGroupsCol();
  renderLearnersCol();
  renderFooter();
}

/* =====================================================
   Selection (checkboxes in the Learners panel) — feeds both
   the bulk-assign action bar and multi-learner drag payloads.
===================================================== */
function renderBulkBarHtml(){
  if(selectedIds.size === 0) return '';
  return `
    <div class="bulk-bar">
      <span><strong>${selectedIds.size}</strong> selected</span>
      <div class="bulk-bar-actions">
        <button class="link" onclick="openBulkAssignModal()">Assign to a Program</button>
        <button class="link" style="color:var(--text-error);" onclick="removeSelectedRows()">Remove</button>
        <button class="link" style="color:var(--text-secondary);" onclick="clearSelection()">Clear</button>
      </div>
    </div>
  `;
}
function toggleRowSelect(id){
  if(selectedIds.has(id)) selectedIds.delete(id); else selectedIds.add(id);
  renderLearnersCol();
}
function clearSelection(){ selectedIds.clear(); renderLearnersCol(); }
function removeSelectedRows(){
  const n = selectedIds.size;
  learners = learners.filter(l=>!selectedIds.has(l.id));
  groups.forEach(g=>selectedIds.forEach(id=>g.assignedIds.delete(id)));
  selectedIds.clear();
  renderAll();
  showToast(`Removed ${n} learner${n===1?'':'s'}.`);
}

/* =====================================================
   PROGRAM CARDS (left column) — create as many as you need;
   each one is a drop target that ADDS whoever's dropped on it.
===================================================== */
function renderGroupsCol(){
  const col = document.getElementById('groupsCol');
  const heading = groups.length === 0
    ? `<div class="empty-hint-card">Create a program here, then add learners to it — by dragging them in, using "+ Add Learners" on the card, or adding them from the Learners panel first.</div>`
    : '';
  col.innerHTML = `
    ${heading}
    ${groups.map(g=>renderGroupCard(g)).join('')}
    <button class="new-group-btn" onclick="addGroup()">+ New Program</button>
  `;
}

function renderGroupCard(g){
  const resolved = !!g.entryId;
  const collapsed = resolved && !g.uiExpanded;
  const chips = learners.filter(l=>g.assignedIds.has(l.id))
    .map(l=>`<span class="chip removable" draggable="true" ondragstart="onLearnerDragStart(event,${l.id})" ondragend="onLearnerDragEnd(event)">${esc(l.email)} <span class="x" onclick="removeFromGroup('${g.id}',${l.id})">${iconX('#0276b1')}</span></span>`)
    .join('');

  const headTitle = resolved
    ? `${esc(entryLabel(g))} · ${esc(g.service)}${g.funded?'<span class="funded-badge">FUNDED</span>':''}`
    : `Program ${groups.indexOf(g)+1}`;

  const head = `<div class="group-card-head">
    <h3>${headTitle}</h3>
    <div style="display:flex;align-items:center;gap:10px;">
      ${resolved ? `<button class="link-sm" onclick="toggleGroupExpanded('${g.id}')">${collapsed?'Change':'Done'}</button>` : ''}
      <button class="icon-btn" style="background:none;border:none;cursor:pointer;color:var(--text-secondary);" title="Remove program" onclick="removeGroup('${g.id}')">${iconX('#5d7682')}</button>
    </div>
  </div>`;

  const picker = collapsed ? '' : renderGroupPicker(g);
  const availability = renderGroupAvailability(g);
  const dateRow = renderGroupDateRow(g);
  const roster = resolved ? `
    <div class="group-chip-row chip-row">${chips || `<span class="muted" style="font-size:12px;">No one assigned yet.</span>`}</div>
    <div class="group-card-actions">
      <button class="btn btn-secondary btn-sm" onclick="openCardAddLearnersModal('${g.id}')">+ Add Learners</button>
      <span class="group-drop-hint">or drag learners onto this card</span>
    </div>` : '';

  return `<div class="group-card ${collapsed?'collapsed':''}" ondragover="onGroupCardDragOver(event)" ondragleave="onGroupCardDragLeave(event)" ondrop="onGroupCardDrop(event,'${g.id}')">
    ${head}
    ${picker}
    ${availability}
    ${dateRow}
    ${roster}
  </div>`;
}

function renderGroupPicker(g){
  const services = Object.keys(CATALOG);
  const portfolios = g.service ? Object.keys(CATALOG[g.service]) : [];
  const subjectNames = (g.service && g.portfolio) ? distinctSubjects(g.service, g.portfolio) : [];
  return `
    <div class="row-between" style="margin-bottom:2px;">
      <span></span>
      <button class="link-sm" onclick="openCatalogModal('${g.id}')">See Everything Available →</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">By Service</span>
      <div class="chip-row">${services.map(s=>`<span class="chip chip-filter ${g.service===s?'selected':''}" onclick="setGroupService('${g.id}','${s}')">${s}</span>`).join('')}</div>
    </div>
    ${g.service ? `<div class="filter-group">
      <span class="filter-label">By Portfolio</span>
      <div class="chip-row">${portfolios.map(p=>`<span class="chip chip-filter ${g.portfolio===p?'selected':''}" onclick="setGroupPortfolio('${g.id}','${esc(p)}')">${esc(p)}</span>`).join('')}</div>
    </div>` : ''}
    ${g.portfolio ? `<div class="filter-group">
      <span class="filter-label">Subject</span>
      <select onchange="setGroupSubjectName('${g.id}', this.value)">
        <option value="">Select a subject</option>
        ${subjectNames.map(name=>{
          const funded = getEntriesFor(g.service, g.portfolio, name).some(e=>e.funded);
          return `<option value="${esc(name)}" ${g.subjectName===name?'selected':''}>${esc(name)}${funded?' (Funded)':''}</option>`;
        }).join('')}
      </select>
    </div>` : ''}
    ${renderGroupHoursRow(g)}
  `;
}
function renderGroupHoursRow(g){
  if(!g.subjectName) return '';
  const entries = getEntriesFor(g.service, g.portfolio, g.subjectName);
  const hoursOptions = [...new Set(entries.map(e=>e.hours).filter(h=>h!=null))];
  if(hoursOptions.length === 0) return '';
  return `<div class="filter-group">
    <span class="filter-label">Hours</span>
    <div class="chip-row">${hoursOptions.map(h=>`<span class="chip chip-filter ${g.hours===h?'selected':''}" onclick="setGroupHours('${g.id}',${h})">${h}h</span>`).join('')}</div>
  </div>`;
}
function renderGroupAvailability(g){
  if(!g.entryId) return '';
  const remaining = remainingSeatsToAdd(g.entryId);
  if(remaining <= 0 && g.assignedIds.size === 0){
    return `<div class="group-avail-line error">No seats available for ${esc(g.subject)}.</div>`;
  }
  return `<div class="group-avail-line">${remaining} seat${remaining===1?'':'s'} left · ${fmtDate(g.start)} – ${fmtDate(g.end)} · ${g.assignedIds.size} assigned</div>`;
}
function renderGroupDateRow(g){
  if(!g.entryId) return '';
  const remaining = remainingSeatsToAdd(g.entryId);
  if(remaining <= 0 && g.assignedIds.size === 0) return '';
  return `<div class="date-row" id="dateRow-${g.id}"><span>Starts ${fmtDate(g.startDate)}</span><button class="link-sm" onclick="toggleGroupDateEdit('${g.id}')">Change</button></div>`;
}
function toggleGroupDateEdit(id){
  const g = groups.find(x=>x.id===id);
  const row = document.getElementById('dateRow-'+id);
  row.innerHTML = `<input type="date" id="dateInput-${id}" value="${g.startDate}" min="${g.start}" max="${g.end}" /><button class="link-sm" onclick="saveGroupDate('${id}')">Save</button>`;
  document.getElementById('dateInput-'+id).focus();
}
function saveGroupDate(id){
  const g = groups.find(x=>x.id===id);
  const val = document.getElementById('dateInput-'+id).value;
  if(val) g.startDate = val;
  renderGroupsCol(); renderFooter();
}
function toggleGroupExpanded(id){
  const g = groups.find(x=>x.id===id);
  g.uiExpanded = !g.uiExpanded;
  renderGroupsCol(); renderFooter();
}

/* ---- "See Everything Available" — browse the full catalog and apply
   a pick directly to the card that opened it ---- */
let catalogModalGroupId = null;
let catalogFilters = { services:new Set(), portfolios:new Set(), search:'' };
function getAllEntries(){
  const out = [];
  Object.keys(CATALOG).forEach(service=>{
    Object.keys(CATALOG[service]).forEach(portfolio=>{
      CATALOG[service][portfolio].forEach(entry=>out.push({ ...entry, service, portfolio }));
    });
  });
  return out;
}
function filteredCatalogEntries(){
  return getAllEntries().filter(e=>{
    if(catalogFilters.services.size > 0 && !catalogFilters.services.has(e.service)) return false;
    if(catalogFilters.portfolios.size > 0 && !catalogFilters.portfolios.has(e.portfolio)) return false;
    if(catalogFilters.search){
      const s = catalogFilters.search.toLowerCase();
      const hay = `${e.subject} ${e.hours||''} ${e.funded?'funded':''}`.toLowerCase();
      if(!hay.includes(s)) return false;
    }
    return true;
  });
}
function openCatalogModal(groupId){
  catalogModalGroupId = groupId;
  catalogFilters = { services:new Set(), portfolios:new Set(), search:'' };
  renderCatalogModalShell();
}
function renderCatalogModalShell(){
  const services = Object.keys(CATALOG);
  const portfolioSet = new Set();
  services.forEach(s=>Object.keys(CATALOG[s]).forEach(p=>portfolioSet.add(p)));
  const portfolios = [...portfolioSet];
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeCatalogModal()">
      <div class="modal" style="width:640px;">
        <div class="modal-head"><h3>Browse All Available Programs</h3><button class="modal-close" onclick="closeCatalogModal()">✕</button></div>
        <div class="modal-body">
          <p class="muted" style="margin:0 0 16px;">Filter or search, then select one to use it on this card.</p>
          <div class="catalog-filters-row">
            <div>
              <span class="filter-label">Service</span>
              <div class="chip-row">${services.map(s=>`<span class="chip chip-filter ${catalogFilters.services.has(s)?'selected':''}" onclick="toggleCatalogFilter('services','${s}')">${s}</span>`).join('')}</div>
            </div>
            <div>
              <span class="filter-label">Portfolio</span>
              <div class="chip-row">${portfolios.map(p=>`<span class="chip chip-filter ${catalogFilters.portfolios.has(p)?'selected':''}" onclick="toggleCatalogFilter('portfolios','${esc(p)}')">${esc(p)}</span>`).join('')}</div>
            </div>
          </div>
          <input class="catalog-search" type="text" placeholder="Search by subject, hours, funded…" value="${esc(catalogFilters.search)}" oninput="onCatalogSearchInput(this.value)" />
          <div id="catalogListRoot"></div>
        </div>
        <div class="modal-foot"><button class="btn btn-secondary" onclick="closeCatalogModal()">Close</button></div>
      </div>
    </div>
  `;
  renderCatalogList();
}
function toggleCatalogFilter(kind, value){
  const set = catalogFilters[kind];
  if(set.has(value)) set.delete(value); else set.add(value);
  renderCatalogModalShell();
}
function onCatalogSearchInput(v){ catalogFilters.search = v; renderCatalogList(); } // updates the list only — keeps focus in the search box
function renderCatalogList(){
  const entries = filteredCatalogEntries();
  if(entries.length === 0){
    document.getElementById('catalogListRoot').innerHTML = `<div class="muted" style="text-align:center;padding:28px 0;">No programs match your filters.</div>`;
    return;
  }
  const bySer = {};
  entries.forEach(e=>{ (bySer[e.service] = bySer[e.service] || {}); (bySer[e.service][e.portfolio] = bySer[e.service][e.portfolio] || []).push(e); });
  let html = '';
  Object.keys(bySer).forEach(service=>{
    html += `<div class="catalog-service-title">${service}</div>`;
    Object.keys(bySer[service]).forEach(portfolio=>{
      html += `<div class="catalog-group"><div class="catalog-group-title">${portfolio}</div>`;
      bySer[service][portfolio].forEach(entry=>{
        const remaining = remainingSeatsToAdd(entry.id);
        html += `<div class="catalog-row">
          <div>
            <div class="name">${esc(entryLabel(entry))}${entry.funded?'<span class="funded-badge">FUNDED</span>':''}</div>
            <div class="meta ${remaining<=0?'zero':''}">${fmtDate(entry.start)} – ${fmtDate(entry.end)} · ${remaining<=0?'No seats available':`${remaining} available`}</div>
          </div>
          <button class="pick" ${remaining<=0?'disabled':''} onclick="pickFromCatalog('${entry.id}')">Select</button>
        </div>`;
      });
      html += `</div>`;
    });
  });
  document.getElementById('catalogListRoot').innerHTML = html;
}
function pickFromCatalog(entryId){
  const g = groups.find(x=>x.id===catalogModalGroupId);
  if(!g) return;
  const entry = getEntry(entryId);
  g.service = entry.service;
  g.portfolio = entry.portfolio;
  g.subjectName = entry.subject;
  resolveGroupEntry(g, entry);
  closeCatalogModal();
  renderGroupsCol(); renderFooter();
}
function closeCatalogModal(){ catalogModalGroupId = null; document.getElementById('modalRoot').innerHTML = ''; }

function addGroup(){
  groups.push({ id:'g'+(nextGroupId++), service:null, portfolio:null, subjectName:null, entryId:null, subject:null, hours:null, funded:false, seats:null, start:null, end:null, startDate:null, assignedIds:new Set(), uiExpanded:true });
  renderGroupsCol(); renderFooter();
}
function removeGroup(id){
  groups = groups.filter(g=>g.id!==id);
  renderAll();
}
function clearGroupAssignmentsIfAny(g, reason){
  if(g.assignedIds.size > 0){
    const n = g.assignedIds.size;
    g.assignedIds.clear();
    showToast(`Cleared ${n} learner${n===1?'':'s'} from this card — ${reason}.`);
  }
}
function setGroupService(id,s){
  const g = groups.find(x=>x.id===id);
  clearGroupAssignmentsIfAny(g, 'program changed');
  g.service=s; g.portfolio=null; g.subjectName=null; g.entryId=null; g.subject=null; g.hours=null; g.funded=false;
  renderGroupsCol(); renderFooter();
}
function setGroupPortfolio(id,p){
  const g = groups.find(x=>x.id===id);
  clearGroupAssignmentsIfAny(g, 'program changed');
  g.portfolio=p; g.subjectName=null; g.entryId=null; g.subject=null; g.hours=null; g.funded=false;
  renderGroupsCol(); renderFooter();
}
function resolveGroupEntry(g, entry){
  // If this card previously pointed at a different program, release those seats —
  // switching what a card is FOR shouldn't silently carry old assignments into the new one.
  if(g.entryId && g.entryId !== entry.id){
    clearGroupAssignmentsIfAny(g, 'program changed');
  }
  // If another card already resolved to this exact program, merge into it
  // instead of creating a second card for the same English · Digital, etc.
  const existing = groups.find(x=>x.id!==g.id && x.entryId===entry.id);
  if(existing){
    g.assignedIds.forEach(id=>existing.assignedIds.add(id));
    groups = groups.filter(x=>x.id!==g.id);
    existing.uiExpanded = false;
    showToast(`${entryLabel(entry)} · ${entry.service} is already set up above — merged into that card.`);
    return;
  }
  g.entryId=entry.id; g.subject=entry.subject; g.hours=entry.hours; g.funded=!!entry.funded;
  g.seats=entry.seats; g.start=entry.start; g.end=entry.end;
  g.startDate = todayISO() > entry.start ? todayISO() : entry.start;
  g.uiExpanded = false;
}
function setGroupSubjectName(id,name){
  const g = groups.find(x=>x.id===id);
  clearGroupAssignmentsIfAny(g, 'program changed');
  g.subjectName = name || null; g.entryId=null; g.subject=null; g.hours=null; g.funded=false;
  if(name){
    const entries = getEntriesFor(g.service, g.portfolio, name);
    if(entries.length === 1) resolveGroupEntry(g, entries[0]);
  }
  renderGroupsCol(); renderFooter();
}
function setGroupHours(id,hours){
  const g = groups.find(x=>x.id===id);
  const entries = getEntriesFor(g.service, g.portfolio, g.subjectName);
  const entry = entries.find(e=>e.hours===hours);
  if(entry) resolveGroupEntry(g, entry);
  renderGroupsCol(); renderFooter();
}
function removeFromGroup(groupId, learnerId){
  const g = groups.find(x=>x.id===groupId);
  if(g) g.assignedIds.delete(learnerId);
  renderAll();
}

/* ---- Per-card "+ Add Learners" picker — the click-based alternative to dragging ---- */
let cardAddModalState = null; // {groupId, selected:Set}
function openCardAddLearnersModal(groupId){
  const g = groups.find(x=>x.id===groupId);
  if(!g) return;
  const available = learners.filter(l=>!g.assignedIds.has(l.id));
  if(available.length === 0){
    if(learners.length === 0){
      pendingCardPickerGroupId = groupId;
      openAddLearnersModal();
    } else {
      showToast('Everyone added is already in this program.');
    }
    return;
  }
  cardAddModalState = { groupId, selected: new Set() };
  renderCardAddLearnersModal();
}
function renderCardAddLearnersModal(){
  const s = cardAddModalState;
  const g = groups.find(x=>x.id===s.groupId);
  const available = learners.filter(l=>!g.assignedIds.has(l.id));
  const remaining = remainingSeatsToAdd(g.entryId);

  const rows = available.map(l=>{
    const sel = s.selected.has(l.id);
    const capped = !sel && s.selected.size >= remaining;
    const progs = programsOf(l.id);
    const classes = ['roster-row']; if(sel) classes.push('selected'); if(capped) classes.push('disabled'); else classes.push('selectable');
    return `<div class="${classes.join(' ')}" ${capped?'':`onclick="toggleCardAddSelect(${l.id})"`} ${capped?'title="Seat limit reached"':''}>
      <span class="check">${sel?iconCheck('#fff'):''}</span>
      <span class="email">${esc(l.email)}</span>
      ${progs.length>0 ? `<span class="badge">also in ${progs.length} program${progs.length===1?'':'s'}</span>` : ''}
    </div>`;
  }).join('');

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeCardAddLearnersModal()">
      <div class="modal">
        <div class="modal-head"><h3>Add Learners to ${esc(entryLabel(g))}</h3><button class="modal-close" onclick="closeCardAddLearnersModal()">✕</button></div>
        <div class="modal-body">
          <div class="seat-counter">${s.selected.size} of ${remaining} seat${remaining===1?'':'s'} selected</div>
          <div class="roster-list">${rows}</div>
        </div>
        <div class="modal-foot">
          <button class="btn btn-secondary" onclick="closeCardAddLearnersModal()">Cancel</button>
          <button class="btn btn-primary" ${s.selected.size===0?'disabled':''} onclick="confirmCardAddLearners()">Add ${s.selected.size} Learner${s.selected.size===1?'':'s'}</button>
        </div>
      </div>
    </div>
  `;
}
function toggleCardAddSelect(id){
  const s = cardAddModalState;
  const g = groups.find(x=>x.id===s.groupId);
  const remaining = remainingSeatsToAdd(g.entryId);
  if(s.selected.has(id)) s.selected.delete(id);
  else { if(s.selected.size >= remaining) return; s.selected.add(id); }
  renderCardAddLearnersModal();
}
function confirmCardAddLearners(){
  const s = cardAddModalState;
  const g = groups.find(x=>x.id===s.groupId);
  const groupId = s.groupId;
  s.selected.forEach(id=>g.assignedIds.add(id));
  showToast(`Added ${s.selected.size} learner${s.selected.size===1?'':'s'} to ${entryLabel(g)} · ${g.service}.`);
  closeCardAddLearnersModal();
  renderAll();

  const stillAvailable = learners.some(l=>!g.assignedIds.has(l.id));
  if(!stillAvailable){
    pendingCardPickerGroupId = groupId;
    openAddLearnersModal();
  }
}
function closeCardAddLearnersModal(){ cardAddModalState = null; document.getElementById('modalRoot').innerHTML = ''; }

/* =====================================================
   DRAG AND DROP — dragging always ADDS to the target
   (membership is additive; use each chip's × to remove).
   Dragging a row that's part of the current selection carries
   the whole selection along.
===================================================== */
function onLearnerDragStart(e, learnerId){
  const ids = (selectedIds.has(learnerId) && selectedIds.size > 1) ? [...selectedIds] : [learnerId];
  e.dataTransfer.setData('text/plain', JSON.stringify(ids));
  e.dataTransfer.effectAllowed = 'copy';
  e.currentTarget.classList.add('dragging');
}
function onLearnerDragEnd(e){ e.currentTarget.classList.remove('dragging'); }
function onGroupCardDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drop-hover'); }
function onGroupCardDragLeave(e){ e.currentTarget.classList.remove('drop-hover'); }
function onLearnersListDragOver(e){ e.preventDefault(); e.currentTarget.classList.add('drop-hover'); }
function onLearnersListDragLeave(e){ e.currentTarget.classList.remove('drop-hover'); }
function onLearnersListDrop(e){ e.preventDefault(); e.currentTarget.classList.remove('drop-hover'); } // dropping back on the roster is a no-op

function onGroupCardDrop(e, targetGroupId){
  e.preventDefault();
  e.currentTarget.classList.remove('drop-hover');
  let ids = [];
  try { ids = JSON.parse(e.dataTransfer.getData('text/plain')); } catch(err) { return; }
  if(!Array.isArray(ids) || ids.length === 0) return;

  const group = groups.find(g=>g.id===targetGroupId);
  if(!group || !group.entryId){ showToast('Choose a program for this card first.'); return; }

  const remaining = remainingSeatsToAdd(group.entryId);
  let added = 0, already = 0, capped = 0;
  for(const id of ids){
    if(group.assignedIds.has(id)){ already++; continue; }
    if(added >= remaining){ capped++; continue; }
    group.assignedIds.add(id); added++;
  }
  if(added > 0) showToast(`Added ${added} learner${added===1?'':'s'} to ${entryLabel(group)} · ${group.service}.`);
  if(capped > 0) showToast(`${capped} learner${capped===1?'':'s'} left out — no seats left.`);
  else if(added === 0 && already > 0) showToast('Already assigned to this program.');
  renderAll();
}

/* =====================================================
   BULK ASSIGN MODAL — "Assign Selected to a Program"
   Same cascade as the program cards; adds the selection to
   whichever program you resolve, existing or brand new.
===================================================== */
function openBulkAssignModal(){
  if(selectedIds.size === 0) return;
  bulkAssignState = { targetIds:[...selectedIds], service:null, portfolio:null, subjectName:null, entryId:null, subject:null, hours:null, funded:false, start:null, end:null, startDate:null };
  renderBulkAssignModal();
}
function renderBulkAssignModal(){
  const s = bulkAssignState;
  const services = Object.keys(CATALOG);
  const portfolios = s.service ? Object.keys(CATALOG[s.service]) : [];
  const subjectNames = (s.service && s.portfolio) ? distinctSubjects(s.service, s.portfolio) : [];

  let hoursHtml = '', availabilityHtml = '';
  if(s.subjectName){
    const entries = getEntriesFor(s.service, s.portfolio, s.subjectName);
    const hoursOptions = [...new Set(entries.map(e=>e.hours).filter(h=>h!=null))];
    if(hoursOptions.length > 0){
      hoursHtml = `<div class="filter-group"><span class="filter-label">Hours</span>
        <div class="chip-row">${hoursOptions.map(h=>`<span class="chip chip-filter ${s.hours===h?'selected':''}" onclick="setBulkAssignHours(${h})">${h}h</span>`).join('')}</div></div>`;
    }
  }
  if(s.entryId){
    const remaining = remainingSeatsToAdd(s.entryId);
    if(remaining <= 0){
      availabilityHtml = `<div class="info-box error"><strong>No seats left for ${esc(s.subject)}</strong><p>Choose a different program.</p></div>`;
    } else {
      availabilityHtml = `<div class="info-box"><strong>${remaining} available${s.funded?' <span class="funded-badge">FUNDED</span>':''}</strong><span>${fmtDate(s.start)} – ${fmtDate(s.end)}</span></div>
        ${s.targetIds.length > remaining ? `<div class="cap-note show">Only ${remaining} of ${s.targetIds.length} selected learners will fit — the rest will stay unassigned.</div>` : ''}`;
    }
  }

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeBulkAssignModal()">
      <div class="modal">
        <div class="modal-head"><h3>Assign Selected to a Program</h3><button class="modal-close" onclick="closeBulkAssignModal()">✕</button></div>
        <div class="modal-body">
          <p class="muted" style="margin:0 0 16px;">Choose a program for the ${s.targetIds.length} learner${s.targetIds.length===1?'':'s'} you selected.</p>
          <div class="filter-group" style="margin-top:0;">
            <span class="filter-label">By Service</span>
            <div class="chip-row">${services.map(sv=>`<span class="chip chip-filter ${s.service===sv?'selected':''}" onclick="setBulkAssignService('${sv}')">${sv}</span>`).join('')}</div>
          </div>
          ${s.service ? `<div class="filter-group"><span class="filter-label">By Portfolio</span>
            <div class="chip-row">${portfolios.map(p=>`<span class="chip chip-filter ${s.portfolio===p?'selected':''}" onclick="setBulkAssignPortfolio('${esc(p)}')">${esc(p)}</span>`).join('')}</div></div>` : ''}
          ${s.portfolio ? `<div class="filter-group"><span class="filter-label">Subject</span>
            <select onchange="setBulkAssignSubjectName(this.value)">
              <option value="">Select a subject</option>
              ${subjectNames.map(name=>{
                const funded = getEntriesFor(s.service, s.portfolio, name).some(e=>e.funded);
                return `<option value="${esc(name)}" ${s.subjectName===name?'selected':''}>${esc(name)}${funded?' (Funded)':''}</option>`;
              }).join('')}
            </select></div>` : ''}
          ${hoursHtml}
          ${availabilityHtml}
        </div>
        <div class="modal-foot">
          <button class="btn btn-secondary" onclick="closeBulkAssignModal()">Cancel</button>
          <button class="btn btn-primary" ${(!s.entryId || remainingSeatsToAdd(s.entryId)<=0)?'disabled':''} onclick="confirmBulkAssign()">Assign</button>
        </div>
      </div>
    </div>
  `;
}
function setBulkAssignService(sv){ bulkAssignState.service=sv; bulkAssignState.portfolio=null; bulkAssignState.subjectName=null; bulkAssignState.entryId=null; renderBulkAssignModal(); }
function setBulkAssignPortfolio(p){ bulkAssignState.portfolio=p; bulkAssignState.subjectName=null; bulkAssignState.entryId=null; renderBulkAssignModal(); }
function setBulkAssignSubjectName(name){
  const s = bulkAssignState;
  s.subjectName = name || null; s.entryId=null; s.subject=null; s.hours=null; s.funded=false;
  if(name){
    const entries = getEntriesFor(s.service, s.portfolio, name);
    if(entries.length === 1) resolveBulkAssignEntry(entries[0]);
  }
  renderBulkAssignModal();
}
function setBulkAssignHours(h){
  const s = bulkAssignState;
  const entries = getEntriesFor(s.service, s.portfolio, s.subjectName);
  const entry = entries.find(e=>e.hours===h);
  if(entry) resolveBulkAssignEntry(entry);
  renderBulkAssignModal();
}
function resolveBulkAssignEntry(entry){
  const s = bulkAssignState;
  s.entryId=entry.id; s.subject=entry.subject; s.hours=entry.hours; s.funded=!!entry.funded;
  s.start=entry.start; s.end=entry.end; s.startDate = todayISO() > entry.start ? todayISO() : entry.start;
}
function confirmBulkAssign(){
  const s = bulkAssignState;
  let group = groups.find(g=>g.entryId===s.entryId);
  if(!group){
    const entry = getEntry(s.entryId);
    group = { id:'g'+(nextGroupId++), service:s.service, portfolio:s.portfolio, subjectName:s.subjectName, entryId:s.entryId,
      subject:s.subject, hours:s.hours, funded:s.funded, seats:entry.seats, start:entry.start, end:entry.end, startDate:s.startDate, assignedIds:new Set() };
    groups.push(group);
  }
  const remaining = remainingSeatsToAdd(s.entryId);
  const toAssign = s.targetIds.filter(id=>!group.assignedIds.has(id)).slice(0, remaining);
  toAssign.forEach(id=>group.assignedIds.add(id));
  showToast(`Assigned ${toAssign.length} learner${toAssign.length===1?'':'s'} to ${esc(s.subject)} · ${s.service}.`);
  closeBulkAssignModal();
  selectedIds.clear();
  renderAll();
}
function closeBulkAssignModal(){ bulkAssignState = null; document.getElementById('modalRoot').innerHTML = ''; }

function renderSendSuccessModal(relevant, assigned){
  const detail = relevant.length <= 1
    ? `<p>${assigned} learner${assigned===1?'':'s'} now ${assigned===1?'has':'have'} access to ${relevant[0] ? esc(entryLabel(relevant[0]))+' · '+esc(relevant[0].service) : 'their program'}.</p>`
    : `<p>${assigned} learners now have access across ${relevant.length} programs:</p>
       <ul style="text-align:left;list-style:none;padding:0;margin:0 0 8px;display:inline-block;">
         ${relevant.map(g=>`<li style="font-size:13px;color:var(--text-secondary);padding:4px 0;">• ${esc(entryLabel(g))} · ${esc(g.service)} — ${g.assignedIds.size} learner${g.assignedIds.size===1?'':'s'}</li>`).join('')}
       </ul>`;
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay" onclick="if(event.target===this) closeGenericModal()">
      <div class="modal" style="width:480px;">
        <div class="modal-body success-card" style="margin:0;">
          <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
            <circle cx="24" cy="24" r="23" fill="#e9f8ee" stroke="#4ac97f"/>
            <path d="M15 24.5l6 6 12-13" stroke="#2f9e56" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h2>Licenses assigned</h2>
          ${detail}
          <div class="success-actions">
            <button class="btn btn-secondary" onclick="showToast('Heading back to Learners.'); closeGenericModal();">Back to Learners</button>
            <button class="btn btn-primary" onclick="closeGenericModal()">Assign more licenses</button>
          </div>
        </div>
      </div>
    </div>
  `;
}
function closeGenericModal(){ document.getElementById('modalRoot').innerHTML = ''; }

renderAll();
</script>
